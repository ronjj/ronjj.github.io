<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infantile Experimentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="turn.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3S4QFM8BT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X3S4QFM8BT');
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        header {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 24px;
        }

        header a {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: grey;
            text-decoration: none;
        }

        header a:hover { color: red; text-decoration: underline; }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 24px;
            color: black;
            margin-top: 10px;
        }

        p.subtitle {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: #555;
            margin-top: 4px;
        }

        #book-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #flipbook {
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .controls button {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            font-size: 14px;
            background: none;
            border: 1px solid #ccc;
            padding: 8px 20px;
            cursor: pointer;
            color: #333;
        }

        .controls button:hover { border-color: #111; color: #111; }
        .controls button:disabled { opacity: 0.3; cursor: default; }

        #page-indicator {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: #777;
            min-width: 80px;
            text-align: center;
        }

        :fullscreen body,
        :-webkit-full-screen body {
            background: #000;
            justify-content: center;
            padding: 0;
        }
        :fullscreen header,
        :-webkit-full-screen header { display: none; }
        :fullscreen #book-container,
        :-webkit-full-screen #book-container { justify-content: center; }
        :fullscreen .controls,
        :-webkit-full-screen .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 4px;
            gap: 16px;
        }
        :fullscreen .controls button,
        :-webkit-full-screen .controls button { color: #fff; border-color: rgba(255,255,255,0.4); }
        :fullscreen #page-indicator,
        :-webkit-full-screen #page-indicator { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>

    <header>
        <a href="../index.html#photography" target="_self">&larr; Back</a>
        <h1>Infantile Experimentation</h1>
        <p class="subtitle">iPhone and 35mm Film Photos from ages 16&ndash;19.</p>
    </header>

    <div id="book-container">
        <div id="flipbook"></div>
        <div class="controls">
            <button id="prev-btn">Previous</button>
            <span id="page-indicator"></span>
            <button id="next-btn">Next</button>
            <button id="present-btn">Present</button>
        </div>
    </div>

    <script src="zine-viewer.js"></script>
    <script>
        initZineViewer({
            pdfPages: 32,
            folder: 'images/infantile-experimentation',
            soloLastPage: true,
            zineTitle: 'infantile-experimentation'
        });
    </script>
</body>
</html>
